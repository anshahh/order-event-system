apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-service
  namespace: order-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-service
  template:
    metadata:
      labels:
        app: rag-service
    spec:
      containers:
        - name: rag-service
          image: anshahh/rag-service:v2
          imagePullPolicy: Always
          ports:
            - containerPort: 8007
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_NAME
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: OPENAI_API_KEY
            - name: DB_HOST
              value: "postgres-service"
            - name: DB_PORT
              value: "5432"
---
apiVersion: v1
kind: Service
metadata:
  name: rag-service
  namespace: order-system
spec:
  type: NodePort
  selector:
    app: rag-service
  ports:
    - port: 8007
      targetPort: 8007
      nodePort: 30007
